name: Validate

on: pull_request

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.framework }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net472, net8.0, net9.0, net10.0]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Resolve library project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          projects=(EBay.*/EBay.*.csproj)
          if [ "${#projects[@]}" -ne 1 ]; then
            echo "expected exactly one EBay.*/EBay.*.csproj, found ${#projects[@]}: ${projects[*]:-<none>}" >&2
            exit 1
          fi
          echo "validating ${projects[0]}"
          echo "path=${projects[0]}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore "${{ steps.project.outputs.path }}" -p:TargetFramework=${{ matrix.framework }}

      - name: Build
        run: dotnet build "${{ steps.project.outputs.path }}" --no-restore -f ${{ matrix.framework }}

      - name: Static analysis
        run: ./scripts/analyze ${{ matrix.framework }}

      # .NET Framework tests need Windows; the netfx job below runs them.
      - name: Test
        if: matrix.framework != 'net472'
        run: dotnet test tests/EBay.ListingManagement.Tests/EBay.ListingManagement.Tests.csproj -f ${{ matrix.framework }}

  # The jobs above test the dependency minimums (Directory.Build.props); this one the latest versions.
  latest-dependencies:
    name: test latest dependencies (${{ matrix.framework }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net9.0, net10.0]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Test
        run: >-
          dotnet test tests/EBay.ListingManagement.Tests/EBay.ListingManagement.Tests.csproj -f ${{ matrix.framework }}
          -p:KiotaVersion=1.* -p:DependencyInjectionVersion=10.* -p:SystemTextJsonVersion=10.*

  netfx:
    name: test (net472, windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.x

      - name: Test (dependency minimums)
        run: dotnet test tests/EBay.ListingManagement.Tests/EBay.ListingManagement.Tests.csproj -f net472

      - name: Test (latest dependencies)
        run: >-
          dotnet test tests/EBay.ListingManagement.Tests/EBay.ListingManagement.Tests.csproj -f net472
          -p:KiotaVersion=1.* -p:DependencyInjectionVersion=10.* -p:SystemTextJsonVersion=10.*

      # .NET Framework projects often compile with C# 7.3; the public API must stay usable from it.
      - name: C# 7.3 consumer compile check
        run: dotnet build tests/EBay.ListingManagement.CSharp73/EBay.ListingManagement.CSharp73.csproj
